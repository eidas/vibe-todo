<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe ToDo</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="hero">
        <h1>Vibe ToDo</h1>
        <p class="tagline">シンプルで気持ちいいタスク管理</p>
      </header>
      <main id="root" aria-live="polite"></main>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const STORAGE_KEY = 'vibe-todo-items';

      const loadTodos = () => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          return stored ? JSON.parse(stored) : [];
        } catch (error) {
          console.warn('ローカルストレージの読み込みに失敗しました', error);
          return [];
        }
      };

      const saveTodos = (todos) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch (error) {
          console.warn('ローカルストレージの保存に失敗しました', error);
        }
      };

      const filters = {
        all: () => true,
        active: (todo) => !todo.completed,
        completed: (todo) => todo.completed,
      };

      const FilterButton = ({ label, value, current, onClick }) => (
        <button
          className={`filter-button ${current === value ? 'is-active' : ''}`}
          onClick={() => onClick(value)}
          type="button"
          aria-pressed={current === value}
        >
          {label}
        </button>
      );

      const TodoItem = ({ todo, onToggle, onDelete }) => (
        <li className="todo-item">
          <label className="todo-label">
            <input
              type="checkbox"
              checked={todo.completed}
              onChange={() => onToggle(todo.id)}
              aria-label={`${todo.title}を${todo.completed ? '未完了' : '完了'}に切り替え`}
            />
            <span className={todo.completed ? 'completed' : ''}>{todo.title}</span>
          </label>
          <button className="ghost-button" onClick={() => onDelete(todo.id)} aria-label={`${todo.title}を削除`}>
            ✕
          </button>
        </li>
      );

      const TodoList = ({ todos, onToggle, onDelete }) => (
        <ul className="todo-list">
          {todos.map((todo) => (
            <TodoItem key={todo.id} todo={todo} onToggle={onToggle} onDelete={onDelete} />
          ))}
        </ul>
      );

      const Stats = ({ total, completed }) => {
        const active = total - completed;
        return (
          <div className="stats" aria-live="polite">
            <span>全{total}件</span>
            <span>未完了 {active}件</span>
            <span>完了 {completed}件</span>
          </div>
        );
      };

      const App = () => {
        const [todos, setTodos] = React.useState(loadTodos);
        const [newTitle, setNewTitle] = React.useState('');
        const [filter, setFilter] = React.useState('all');

        React.useEffect(() => {
          saveTodos(todos);
        }, [todos]);

        const handleSubmit = (event) => {
          event.preventDefault();
          const title = newTitle.trim();
          if (!title) return;

          const nextTodos = [
            { id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(), title, completed: false },
            ...todos,
          ];
          setTodos(nextTodos);
          setNewTitle('');
        };

        const toggleTodo = (id) => {
          setTodos((prev) => prev.map((todo) => (todo.id === id ? { ...todo, completed: !todo.completed } : todo)));
        };

        const deleteTodo = (id) => {
          setTodos((prev) => prev.filter((todo) => todo.id !== id));
        };

        const clearCompleted = () => {
          setTodos((prev) => prev.filter((todo) => !todo.completed));
        };

        const visibleTodos = todos.filter(filters[filter]);
        const completedCount = todos.filter((todo) => todo.completed).length;

        return (
          <section className="panel" aria-label="ToDoリスト">
            <form className="todo-form" onSubmit={handleSubmit}>
              <input
                type="text"
                placeholder="タスクを追加..."
                value={newTitle}
                onChange={(event) => setNewTitle(event.target.value)}
                aria-label="新しいタスク"
              />
              <button type="submit" className="primary-button">追加</button>
            </form>

            <div className="toolbar">
              <div className="filters" role="group" aria-label="フィルター">
                <FilterButton label="すべて" value="all" current={filter} onClick={setFilter} />
                <FilterButton label="未完了" value="active" current={filter} onClick={setFilter} />
                <FilterButton label="完了" value="completed" current={filter} onClick={setFilter} />
              </div>
              <button className="ghost-button" onClick={clearCompleted} type="button">完了を一括削除</button>
            </div>

            <Stats total={todos.length} completed={completedCount} />

            {visibleTodos.length > 0 ? (
              <TodoList todos={visibleTodos} onToggle={toggleTodo} onDelete={deleteTodo} />
            ) : (
              <p className="empty">タスクはまだありません</p>
            )}
          </section>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
